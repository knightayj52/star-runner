# 별바람 대모험 4.4 파일을 받아 index.html 로 반영하는 1회용 작업
name: apply-4.4
on:
  push:
    paths: ['.github/workflows/apply-4.4.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: |
          curl -sSfL -o index.html "https://d2ol7oe51mr4n9.cloudfront.net/user_36iAWhqwscYQFwhc6gUqDfufcNP/8ede3aef-0d9d-4dd8-9c88-db921432ae22.html"
          echo "0f9ff02fe5fa53e9deef1a971a384d86  index.html" | md5sum -c -
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "별바람 대모험 4.4: 창세 등급 소환수 3종(노바·우르사·이그드라), 개발자 코드"
          git push
