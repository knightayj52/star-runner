# 별바람 대모험 4.2 파일을 받아 index.html 로 반영하는 1회용 작업
name: apply-4.2
on:
  push:
    paths: ['.github/workflows/apply-4.2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: |
          curl -sSfL -o index.html "https://d2ol7oe51mr4n9.cloudfront.net/user_36iAWhqwscYQFwhc6gUqDfufcNP/7e65dcfb-b6e1-484f-9daf-64553f5e0d1f.html"
          echo "30b4533452d7dd67587b29d1ec76ca9d  index.html" | md5sum -c -
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "별바람 대모험 4.2: 소환수 달리기 동작, 새 몬스터·장애물, 거리 비례 난이도"
          git push
